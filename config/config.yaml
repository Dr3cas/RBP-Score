blast:
  evalue_cutoff: 1e-5
  pident_cutoff: 30.0
  coverage_cutoff: 0.50

blast_score_weights:
  identity: 0.35
  coverage: 0.30
  bitscore: 0.25
  evalue: 0.10

structural_score_weights:
  qtmscore: 0.50
  alntmscore: 0.30
  rmsd: 0.20

final_rbpscore_weights:
  sequence: 0.35
  phylogeny: 0.25
  structural: 0.40

outgroup_penalty:
  blast: 0.10
  phylogeny: 0.15
  structural: 0.20

foldseek:
  evalue: 10
  max_seqs: 1000
  alignment_type: 1

colabfold:
  gpu: 0
  num_models: 1
  num_recycle: 1
  msa_mode: mmseqs2_uniref_env

outgroup_filters:
  min_identity: 20.0
  min_length: 10
  max_evalue: 1000.0

normalization:
  evalue_max_log: 150.0